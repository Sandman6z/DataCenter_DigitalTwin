version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: if_not_present
    ports:
      - "80:80"
    depends_on:
      - backend

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: if_not_present
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/datacenter-dt
      - PORT=3000
      - MQTT_BROKER=mqtt://mosquitto:1883
      - MQTT_TOPIC=datacenter/sensors
    depends_on:
      - mongo
      - mosquitto

  # MongoDB数据库
  mongo:
    image: mongo:4.4
    pull_policy: if_not_present
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # MQTT broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    pull_policy: if_not_present
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

# 持久化存储
volumes:
  mongo-data:
