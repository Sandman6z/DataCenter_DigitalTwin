services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dt-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/datacenter-dt}
      - PORT=3000
      - MQTT_BROKER=${MQTT_BROKER:-mqtt://mosquitto:1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-datacenter/sensors}
      - MQTT_USERNAME=${MQTT_USERNAME:-admin}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-admin123}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dt-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # MongoDB数据库 (升级到 6.0)
  mongo:
    image: mongo:6.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dt-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # MQTT broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/password_file:/mosquitto/config/password_file
      - ./mosquitto/config/acl_file:/mosquitto/config/acl_file
      - ./mosquitto/certs:/mosquitto/certs
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -u '${MQTT_USERNAME:-admin}' -P '${MQTT_PASSWORD:-admin123}' -W 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - dt-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

networks:
  dt-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
    internal: false
    attachable: false

volumes:
  mongo-db-data:
  mosquitto-data:
  mosquitto-log:
